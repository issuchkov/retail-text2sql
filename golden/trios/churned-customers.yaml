id: churned-customers
question: How many customers have churned?
intent: Customers whose last non-cancelled, non-returned purchase is more than 90 days ago.
sql: |
  WITH last_purchase AS (
    SELECT customer_key, MAX(created_at) AS last_order_at
    FROM order_items
    WHERE status NOT IN ('Cancelled', 'Returned')
    GROUP BY customer_key
  )
  SELECT COUNT(*) AS customers,
    COUNTIF(last_order_at < TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 90 DAY)) AS churned,
    ROUND(SAFE_DIVIDE(COUNTIF(last_order_at < TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 90 DAY)),
                      COUNT(*)) * 100, 1) AS churn_rate_pct
  FROM last_purchase
report: |
  States the churn definition before the number, then the churn rate, and notes that a
  long purchase cycle in apparel makes a 90-day window strict.
definitions:
- term: churn
  definition: no purchase in the 90 days before the end of the period analysed
tags:
