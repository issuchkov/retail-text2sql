id: gross-margin-by-category
question: Which categories make the most margin?
intent: Gross margin (net sale price minus product cost) and margin rate per category.
sql: |
  SELECT p.category, ROUND(SUM(oi.sale_price), 2) AS net_revenue,
    ROUND(SUM(oi.sale_price - p.cost), 2) AS gross_margin,
    ROUND(SAFE_DIVIDE(SUM(oi.sale_price - p.cost), SUM(oi.sale_price)) * 100, 1) AS gross_margin_pct
  FROM order_items AS oi
  JOIN products AS p ON p.id = oi.product_id
  WHERE oi.status NOT IN ('Cancelled', 'Returned')
  GROUP BY p.category
  ORDER BY gross_margin DESC
report: |
  Distinguishes categories that make margin through volume from those with a high margin
  rate, which call for different actions.
definitions:
- term: revenue
  definition: sum of sale_price of items whose status is not Cancelled or Returned
- term: gross margin
  definition: net sale_price minus products.cost
tags:
