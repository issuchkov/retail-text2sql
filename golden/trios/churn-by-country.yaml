id: churn-by-country
question: Which countries have the most churned customers?
intent: Churned customers (90-day definition) aggregated by country.
sql: |
  WITH last_purchase AS (
    SELECT customer_key, MAX(created_at) AS last_order_at
    FROM order_items
    WHERE status NOT IN ('Cancelled', 'Returned')
    GROUP BY customer_key
  )
  SELECT u.country, COUNT(*) AS customers,
    COUNTIF(lp.last_order_at < TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 90 DAY)) AS churned
  FROM last_purchase AS lp
  JOIN users AS u USING (customer_key)
  GROUP BY u.country
  ORDER BY churned DESC
  LIMIT 10
report: |
  Compares churn counts with each country's customer base so a large market is not
  mistaken for a churn problem, and stays at country level.
definitions:
- term: churn
  definition: no purchase in the 90 days before the end of the period analysed; count only
    customers with at least one item that was not cancelled or returned, judged by their last
    such purchase
