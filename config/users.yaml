# Identities for the prototype (SPEC §2). The CLI selects one with --user.
# Production: the frontend's JWT carries the user id and brand scopes; this file goes away.
# scope: `all: true` (company-wide roles) or a list of brands the user manages.
users:
  - id: alice
    name: Alice Moreno
    title: Brand Manager, Calvin Klein
    scope:
      brands: [Calvin Klein]

  - id: bob
    name: Bob Chen
    title: Denim Portfolio Manager
    scope:
      brands: [Levi's, Wrangler, Diesel]

  - id: carol
    name: Carol Diaz
    title: Chief Executive Officer
    scope:
      all: true
